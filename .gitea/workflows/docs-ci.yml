# Keeps the public pages clean: no internal host names, share paths or tracker ids, no dead
# relative links, no drifted counts. tools/doclint.sh is the whole check.
name: docs-ci

on:
  push:
    branches: [main]
    paths: ["**.md", "tools/doclint.sh", ".gitea/workflows/docs-ci.yml"]
  pull_request:
    paths: ["**.md", "tools/doclint.sh", ".gitea/workflows/docs-ci.yml"]
  workflow_dispatch:

jobs:
  doclint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/doclint.sh
