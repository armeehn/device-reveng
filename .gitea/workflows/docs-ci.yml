# Keeps the public pages and scripts clean: no internal host names, share paths or tracker ids, no dead
# relative links, no drifted counts. tools/doclint.sh is the whole check.
name: docs-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  doclint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/doclint.sh
