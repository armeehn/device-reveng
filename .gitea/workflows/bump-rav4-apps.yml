# Keeps the rav4-apps submodule pointer on main tracking the latest rav4-apps main.
# Runs daily and on manual dispatch; only commits when the pointer actually moved,
# and the resulting push to main goes through the normal launcher-ci release flow.
#
# The pointer is a SHA, so nothing is cloned: rav4-apps on this Gitea is private and the
# job's token reads this repo only (every run failed at the submodule checkout for that
# reason). Its GitHub mirror is public and held equal to Gitea main by the sync timer on
# the operator host, so `ls-remote` there answers the same SHA without a credential.
name: bump-rav4-apps

on:
  schedule:
    - cron: "0 9 * * *" # 09:00 UTC daily
  workflow_dispatch: {}

env:
  RAV4_APPS_MIRROR: https://github.com/armeehn/rav4-apps.git

jobs:
  bump:
    runs-on: ubuntu-latest
    # Only this job writes refs; the token is the Gitea Actions token.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Bump rav4-apps to latest main
        run: |
          set -euo pipefail
          have="$(git ls-tree HEAD rav4-apps | awk '{print $3}')"
          want="$(git ls-remote "$RAV4_APPS_MIRROR" refs/heads/main | awk '{print $1}')"
          [ -n "$want" ] || { echo "no main at $RAV4_APPS_MIRROR"; exit 1; }
          if [ "$have" = "$want" ]; then
            echo "rav4-apps already at ${want:0:7}; nothing to do."
            exit 0
          fi
          # A gitlink update needs no checkout of the submodule: write the tree entry.
          git update-index --cacheinfo "160000,$want,rav4-apps"
          git config user.name "gitea-actions[bot]"
          git config user.email "gitea-actions@ripostelabs.xyz"
          git commit -m "chore: bump rav4-apps submodule to ${want:0:7}"
          # On the schedule this is main; a dispatch from a branch pushes to that branch,
          # which is how the job is tried without touching main.
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "Bumped rav4-apps ${have:0:7} -> ${want:0:7} on ${GITHUB_REF_NAME}."
