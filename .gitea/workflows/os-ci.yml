# Host-side checks for the Riposte OS tooling in os/: no device, no images, python3 + bash,
# plus the arm64 cross compiler for the touch proxy.
name: os-ci

on:
  push:
    branches: [main]
    paths:
      - "os/**"
      - ".gitea/workflows/os-ci.yml"
  pull_request:
    paths:
      - "os/**"
      - ".gitea/workflows/os-ci.yml"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          for f in os/*.sh; do bash -n "$f"; done
          python3 -m py_compile os/*.py os/uplink/*.py
          bash -n os/uplink/*.sh
      - name: edl-extents
        run: os/test-edl-extents.sh
      - name: edl-restore
        run: os/test-edl-restore.sh
      - name: vbmeta-flags
        run: os/test-vbmeta-flags.sh
      - name: image set fits the super
        run: os/test-super-fit.sh
      - name: mainline boot image packer
        run: os/mainline/test-mkboot.sh
      - name: diag check
        run: os/diag/test_check.sh
      - name: root grant + camera mode scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3
          os/test-root-camera.sh
      - name: usb role script
        run: os/test-usb-role.sh
      - name: init services keep their lib path
        run: os/test-rc-libpath.sh
      - name: suspend is s2idle, as on stock
        run: os/test-sleep-mode.sh
      - name: blockfix stops on a failed read
        run: os/test-blockfix.sh
      - name: flash-0.2 parses and fetches only os/ helpers
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          os/test-flash-02.sh
      - name: car USB updater parses and fetches only car-update/ files
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          os/test-car-update.sh
      - name: uplink init script (pin, flags, key file)
        run: os/test-uplink.sh
      - name: car ingest service
        run: python3 -m unittest -v
        working-directory: os/uplink
      - name: touchswap compiles
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gcc-aarch64-linux-gnu
          aarch64-linux-gnu-gcc -O2 -static -Wall -Wextra -Werror -o /tmp/riposte-touchswap os/touchswap/riposte-touchswap.c
