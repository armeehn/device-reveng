appId: com.ripostelabs.carlauncher
name: Every Settings row opens a screen that names itself
# One row, one screen, one Back. A row that opens nothing, or a screen that does not carry the
# row's name, is a dead route or a naming drift. The hub returns to the top after each visit,
# so every row is scrolled to again; a parenthetical qualifier on a row ("All settings
# (advanced)" -> "All settings") is not part of the name the screen must carry.
---
- launchApp
- tapOn: { point: "96%,7%" }        # Settings
- extendedWaitUntil:
    visible: "Launcher"
    timeout: 8000
- scrollUntilVisible:
    element:
      text: "Launcher"
    direction: DOWN
    timeout: 30000
- tapOn: "Launcher"
- extendedWaitUntil:
    visible: "Launcher"
    timeout: 8000
- back
- extendedWaitUntil:
    visible: "App directory"
    timeout: 8000
- scrollUntilVisible:
    element:
      text: "App directory"
    direction: DOWN
    timeout: 30000
- tapOn: "App directory"
- extendedWaitUntil:
    visible: "App directory"
    timeout: 8000
- back
- extendedWaitUntil:
    visible: "App directory"
    timeout: 8000
