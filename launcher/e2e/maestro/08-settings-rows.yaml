appId: com.ripostelabs.carlauncher
name: Every Settings row opens a screen that names itself
# One row, one screen, one Back. A row that opens nothing, or a screen that does not carry the
# row's name, is a dead route or a naming drift. A parenthetical qualifier on a row
# ("All settings (advanced)" -> "All settings") is not part of the name the screen must carry.
#
# The hub's subtitle is the only text on the hub and on no page, so it marks where we are: gone
# means the page opened, back means Back returned to the hub. The row's own name cannot do that,
# because the hub shows it too. Back keeps the hub where it was, so the next row is at most a
# swipe away. When the hub came back at the top, every row was a scroll from the top against the
# same 30 s budget, and the low rows ran out of it on the slower CI emulator (2026-09-30).
---
- launchApp
- extendedWaitUntil:
    visible: "Search apps"
    timeout: 20000
- tapOn: { point: "96%,7%" }        # Settings
- extendedWaitUntil:
    visible: "(Read-only: root not detected.*|Car & launcher configuration)"
    timeout: 20000
- scrollUntilVisible:
    element:
      text: "Launcher"
    direction: DOWN
    timeout: 30000
- tapOn: "Launcher"
- extendedWaitUntil:
    notVisible: "(Read-only: root not detected.*|Car & launcher configuration)"
    timeout: 20000
- extendedWaitUntil:
    visible: "Launcher"
    timeout: 20000
- back
- extendedWaitUntil:
    visible: "(Read-only: root not detected.*|Car & launcher configuration)"
    timeout: 20000
