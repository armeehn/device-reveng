appId: com.ripostelabs.carlauncher
name: Day and night both render Home (contrast pair)
---
- launchApp
- takeScreenshot: theme-before
- tapOn: { point: "50%,7%" }        # day/night (icon only; the default theme dims 7% at night)
- extendedWaitUntil:
    visible: "Search apps"
    timeout: 20000
- takeScreenshot: theme-after
- tapOn: { point: "50%,7%" }
- extendedWaitUntil:
    visible: "Search apps"
    timeout: 20000
