appId: com.ripostelabs.compass
name: Suite Compass opens and comes back
---
- launchApp:
    appId: com.ripostelabs.compass
    stopApp: true
- extendedWaitUntil:
    visible: "Compass"
    timeout: 8000
- takeScreenshot: suite-compass
- pressKey: Home
- extendedWaitUntil:
    visible: "Search apps"
    timeout: 10000
