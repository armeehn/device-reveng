# Project-wide Gradle settings.

# JVM args for the Gradle daemon. 2G heap is plenty for a two-module project.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use AndroidX (required for Compose / Material3).
android.useAndroidX=true
# Do NOT enable Jetifier — no legacy support libraries here.
android.enableJetifier=false

# Kotlin code style.
kotlin.code.style=official

# Faster incremental builds.
org.gradle.parallel=true
org.gradle.caching=true

# Each module's R class holds only its own resources (no transitive merge):
# smaller R classes, faster incremental compiles. This does NOT trim
# resource configurations or ABIs — those are per-module build settings.
android.nonTransitiveRClass=true
