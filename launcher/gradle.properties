# Project-wide Gradle settings.

# JVM args for the Gradle daemon. CI compiles the debug, farm and release variants in
# parallel, and at 2G the Kotlin compile died with "GC overhead limit exceeded" on every
# build from 2026-10-01. The Kotlin daemon gets the same heap explicitly.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx4096m

# Use AndroidX (required for Compose / Material3).
android.useAndroidX=true
# Do NOT enable Jetifier — no legacy support libraries here.
android.enableJetifier=false

# Kotlin code style.
kotlin.code.style=official

# Faster incremental builds.
org.gradle.parallel=true
org.gradle.caching=true

# Each module's R class holds only its own resources (no transitive merge):
# smaller R classes, faster incremental compiles. This does NOT trim
# resource configurations or ABIs — those are per-module build settings.
android.nonTransitiveRClass=true
