# Project-wide Gradle settings.

# JVM args for the Gradle daemon. 2G heap is plenty for a two-module project.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use AndroidX (required for Compose / Material3).
android.useAndroidX=true
# Do NOT enable Jetifier — no legacy support libraries here.
android.enableJetifier=false

# Kotlin code style.
kotlin.code.style=official

# Faster incremental builds.
org.gradle.parallel=true
org.gradle.caching=true

# Only generate the resources/config for the ABIs/densities we ship to.
# (Single head-unit target: arm64, xxhdpi-ish @240dpi landscape.)
android.nonTransitiveRClass=true
