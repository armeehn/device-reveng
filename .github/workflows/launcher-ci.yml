name: launcher-ci

# Compile and test the head-unit launcher on every push/PR that touches it.
# Three signals, in order of how fast they fail:
#   1. JVM unit tests over the pure logic (no device, no emulator).
#   2. The release assemble with R8 + resource shrinking — exactly what
#      gets side-loaded, so a keep-rule regression shows up here.
#   3. An APK size budget, because R8 failures are usually silent growth.

on:
  push:
    branches: [main]
    paths:
      - "launcher/**"
      - ".github/workflows/launcher-ci.yml"
  pull_request:
    paths:
      - "launcher/**"
      - ".github/workflows/launcher-ci.yml"
  workflow_dispatch:

concurrency:
  group: launcher-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4

      # Kotlin/AGP toolchain requires JDK 17 (system JDKs newer than 21
      # break the Kotlin compile — see launcher/README).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Gradle + configuration caching keyed off the wrapper/lockstate.
      - uses: gradle/actions/setup-gradle@v4

      # Runs before the assemble so a broken decoder fails in ~1 min rather
      # than after a full R8 pass. `test` covers :app and :carlib, debug and
      # release variants; a failing test fails the job.
      - name: Unit tests
        run: ./gradlew --no-daemon test

      # Always upload, so a red run leaves the failure reports behind.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carlauncher-test-reports
          path: launcher/*/build/reports/tests/
          if-no-files-found: ignore

      # The runner image ships the Android SDK; AGP resolves it via
      # ANDROID_HOME and downloads any missing platform/build-tools itself.
      - name: Build release and debug APKs
        run: ./gradlew --no-daemon assembleRelease assembleDebug

      # R8 and resource shrinking fail quietly: a lost keep rule or a newly
      # unshrunk dependency shows up as a bigger APK, never as a build error.
      # The head unit is side-loaded over a slow link, so growth is a real
      # cost. Budget is the measured size plus ~20% headroom — raise it in
      # the same commit that legitimately grows the app, and say why.
      - name: Check APK size budget
        run: |
          budget=8388608   # 8 MiB
          apk=app/build/outputs/apk/release/app-release.apk
          size=$(stat -c%s "$apk")
          echo "release APK: $size bytes (budget $budget)"
          if [ "$size" -gt "$budget" ]; then
            echo "::error::release APK is $size bytes, over the $budget byte budget"
            exit 1
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: carlauncher-release-apk
          path: launcher/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: carlauncher-debug-apk
          path: launcher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # v2.9 — a cold-start budget, so a startup regression fails a PR instead of
  # being noticed months later in the car.
  #
  # WHAT THIS NUMBER IS, AND IS NOT. It is measured on an x86_64 emulator on a
  # GitHub runner, not on the QCM6125 head unit, so it is NOT a device figure and
  # must never be quoted as one. It is a tripwire: same image, same APK shape,
  # same procedure every run, so a large jump means we made startup worse.
  # The debug build is what gets installed because release is arm64-only
  # (app/build.gradle.kts) — debug adds x86_64 for exactly this kind of run.
  cold-start:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/download-artifact@v4
        with:
          name: carlauncher-debug-apk
          path: apk

      # The emulator needs KVM, which the ubuntu-latest image has but does not
      # expose to the runner user by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 33 matches the head unit's Android 13. AOSP ATD image: no Play
      # services, so the measurement is not polluted by GMS starting up.
      - name: Measure cold start
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: .github/scripts/cold-start.sh apk

  # Release traceability. A green build of main gets an annotated tag naming the
  # exact version it was built from, and the release APK from *that same run* is
  # published against the tag with its SHA-256. That is what turns "which APK is
  # in the car" into a question with a checkable answer.
  #
  # Needs both build jobs, so a red run is never tagged and never publishes.
  release:
    runs-on: ubuntu-latest
    needs: [build, cold-start]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 10
    permissions:
      # Job-scoped on purpose: only this job may write refs and releases, every
      # other job in the workflow keeps the default read-only token.
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Parse, don't guess. Each field must match exactly one line and then still
      # look like a version. A regex that silently yields an empty string would
      # tag the commit `v` and the tag would be worthless.
      - name: Read version from build.gradle.kts
        id: version
        run: |
          set -euo pipefail
          gradle_file="launcher/app/build.gradle.kts"

          # Assigns through a nameref rather than returning on stdout, so an
          # ::error:: from in here reaches the log instead of being swallowed by a
          # command substitution.
          read_field() {   # read_field <destination-var> <gradle-key>
            local -n dest="$1"
            local key="$2" lines count
            lines="$(grep -E "^[[:space:]]*${key}[[:space:]]*=" "$gradle_file" || true)"
            count="$(printf '%s' "$lines" | grep -c . || true)"
            if [ "$count" != "1" ]; then
              echo "::error file=${gradle_file}::expected exactly one '${key} =' line, found ${count}"
              exit 1
            fi
            dest="$(printf '%s' "$lines" \
              | sed -E "s/^[[:space:]]*${key}[[:space:]]*=[[:space:]]*//; s/^\"//; s/\".*\$//; s/[[:space:]]*\$//")"
          }

          read_field name versionName
          read_field code versionCode

          # Shape check, so a trailing comment or a moved quote fails here rather
          # than after a meaningless tag has already been pushed.
          if ! printf '%s' "$name" | grep -qE '^[0-9]+(\.[0-9]+){1,3}$'; then
            echo "::error file=${gradle_file}::versionName '${name}' is not a dotted numeric version"
            exit 1
          fi
          if ! printf '%s' "$code" | grep -qE '^[0-9]+$'; then
            echo "::error file=${gradle_file}::versionCode '${code}' is not an integer"
            exit 1
          fi

          # Tag identity. versionName repeats across builds, and so does versionCode
          # — the last two merges to main both shipped versionCode 61 — so neither
          # field, nor both together, identifies a build. The short commit SHA does.
          # All three ride along as SemVer build metadata: the tag still reads as
          # `vX.Y.Z...`, and it is unique by construction, so two merges can never
          # collide on a tag name however sloppy the version bumps get.
          short="$(git rev-parse --short=7 HEAD)"
          {
            echo "name=${name}"
            echo "code=${code}"
            echo "tag=v${name}+${code}.g${short}"
          } >> "$GITHUB_OUTPUT"
          echo "versionName ${name}, versionCode ${code} -> tag v${name}+${code}.g${short}"

      - name: Create annotated tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail

          # A merge that bumped neither version field is not an error — the SHA in
          # the tag keeps this build distinguishable — but say so, because two
          # shipped builds then differ only by commit. This is not hypothetical:
          # the last two merges to main both carry versionCode 61.
          prior="$(git ls-remote --tags origin "refs/tags/v${VERSION_NAME}+${VERSION_CODE}.g*" \
            | sed -E 's|.*refs/tags/||; s|\^\{\}$||' | sort -u | grep -vFx "${TAG}" || true)"
          if [ -n "${prior}" ]; then
            echo "::warning::versionCode ${VERSION_CODE} already shipped as ${prior//$'\n'/, } — bump it on the next merge"
          fi

          # Idempotent: a re-run of this job finds its own tag already on the remote
          # and stops cleanly. The push below is never forced, so even a lost race
          # can only fail — it can never move a tag that points at another build.
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on origin — skipping, nothing to move."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "carlauncher ${VERSION_NAME} (versionCode ${VERSION_CODE})"
          git push origin "refs/tags/${TAG}"
          echo "Tagged ${GITHUB_SHA} as ${TAG}."

      # The artifact from the `build` job above — the APK compiled from this exact
      # commit. Nothing is rebuilt here; a rebuild would not be the artifact the
      # tag is meant to identify.
      - name: Fetch the release APK from this run
        uses: actions/download-artifact@v4
        with:
          name: carlauncher-release-apk
          path: artifact

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail

          mapfile -t apks < <(find artifact -type f -name '*.apk')
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::expected exactly one release APK in the artifact, found ${#apks[@]}"
            exit 1
          fi

          # Name the asset for the tag, so a downloaded APK still identifies itself
          # once it is sitting on a USB stick with no surrounding context.
          asset="carlauncher-${TAG}.apk"
          cp "${apks[0]}" "${asset}"
          sha="$(sha256sum "${asset}" | cut -d' ' -f1)"

          # Idempotent independently of the tag step, so a re-run after a publish
          # that half-finished still completes the release for an existing tag.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — leaving it untouched."
            exit 0
          fi

          cat > notes.md <<EOF
          Built by CI from commit \`${GITHUB_SHA}\`.

          | | |
          |---|---|
          | versionName | \`${VERSION_NAME}\` |
          | versionCode | \`${VERSION_CODE}\` |
          | APK | \`${asset}\` |
          | SHA-256 | \`${sha}\` |

          This asset is the CI artifact of the tagged main build — the only APK that
          goes on-device. To identify what is already installed, pull the APK off the
          head unit and compare its \`sha256sum\` with the value above.

          Signed with a **debug** key (see \`launcher/app/build.gradle.kts\`), so the
          signature is not stable across runners and an update can be refused with a
          signature mismatch. Fixing that needs owner action.
          EOF

          gh release create "${TAG}" "${asset}" \
            --verify-tag \
            --title "${TAG}" \
            --notes-file notes.md
