name: launcher-ci

# Compile and test the head-unit launcher on every push/PR that touches it.
# Five signals, in order of how fast they fail:
#   1. JVM unit tests over the pure logic (no device, no emulator).
#   2. The release assemble with R8 + resource shrinking — exactly what
#      gets side-loaded, so a keep-rule regression shows up here.
#   3. An APK size budget, because R8 failures are usually silent growth.
#   4. Compose UI tests on an emulator, pinning the status indicators.
#   5. A cold-start budget on the same emulator.
#
# Both emulator jobs boot the head unit's geometry (1920x720 @240dpi
# landscape), not a phone profile — see .github/scripts/headunit-avd.sh.

on:
  push:
    branches: [main]
    paths:
      - "launcher/**"
      - ".github/workflows/launcher-ci.yml"
      - ".github/scripts/**"
  pull_request:
    paths:
      - "launcher/**"
      - ".github/workflows/launcher-ci.yml"
      - ".github/scripts/**"
  workflow_dispatch:

concurrency:
  group: launcher-ci-${{ github.ref }}
  # Cancel superseded runs on PRs only. On main, two merges landing within one
  # run's duration share the group, and cancelling the older run would kill its
  # release job — that merged build would never be tagged or published.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The AVD name is shared: the action creates the AVD under it and
# headunit-avd.sh has to find that same directory to patch its config.ini.
env:
  AVD_NAME: headunit_1920x720

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: launcher
    steps:
      # Full history: versionCode is the git commit count (derived in
      # app/build.gradle.kts, which refuses a shallow clone at configure time).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Kotlin/AGP toolchain requires JDK 17 (system JDKs newer than 21
      # break the Kotlin compile — see launcher/README).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Gradle + configuration caching keyed off the wrapper/lockstate.
      # Pinned to the commit v4 points at, NOT the tag. `v4` on gradle/actions is an
      # ANNOTATED tag, and act_runner cannot dereference one: it clones the repo and
      # dies with "Unable to resolve v4: unsupported object type", killing the job
      # before any Gradle task. (`git ls-remote` shows it: gradle/actions returns two
      # lines for v4, a lightweight tag like actions/checkout returns one. v5 is
      # annotated too, so bumping does not help.)
      #
      # A step-level `if:` does NOT avoid this -- actions are resolved before step
      # conditions are evaluated, so the clone happens even when the step is skipped.
      # Pinning is what actually fixes it, and it keeps build caching on both hosts.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # Runs before the assemble so a broken decoder fails in ~1 min rather
      # than after a full R8 pass. `test` covers :app and :carlib, debug and
      # release variants; a failing test fails the job.
      - name: Unit tests
        run: ./gradlew --no-daemon test

      # Always upload, so a red run leaves the failure reports behind.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carlauncher-test-reports
          path: launcher/*/build/reports/tests/
          if-no-files-found: ignore

      # The only lint run anywhere: assembleRelease deliberately skips
      # lint-vital (app/build.gradle.kts). Errors fail the job, warnings do
      # not; pre-existing errors are frozen in app/lint-baseline.xml.
      - name: Lint
        run: ./gradlew --no-daemon :app:lintRelease

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carlauncher-lint-report
          path: launcher/app/build/reports/lint-results-release.html
          if-no-files-found: ignore

      # The runner image ships the Android SDK; AGP resolves it via
      # ANDROID_HOME and downloads any missing platform/build-tools itself.
      #
      # The RELEASE_* secrets are optional and currently unset: absent secrets
      # resolve to empty strings and the release build falls back to the debug
      # key, exactly as before. Adding them (launcher/SIGNING.md) switches the
      # release APK to a stable owner-held signature with no workflow change.
      - name: Build release and debug APKs
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASS }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASS: ${{ secrets.RELEASE_KEY_PASS }}
        run: ./gradlew --no-daemon assembleRelease assembleDebug

      # R8 and resource shrinking fail quietly: a lost keep rule or a newly
      # unshrunk dependency shows up as a bigger APK, never as a build error.
      # The head unit is side-loaded over a slow link, so growth is a real
      # cost. Budget is the measured size plus ~20% headroom — raise it in
      # the same commit that legitimately grows the app, and say why.
      - name: Check APK size budget
        run: |
          budget=8388608   # 8 MiB
          apk=app/build/outputs/apk/release/app-release.apk
          size=$(stat -c%s "$apk")
          echo "release APK: $size bytes (budget $budget)"
          if [ "$size" -gt "$budget" ]; then
            echo "::error::release APK is $size bytes, over the $budget byte budget"
            exit 1
          fi

      # output-metadata.json rides along: it is AGP's record of the versionName/
      # versionCode actually baked into the APK, and the release job reads the
      # version from it (there is no version line in the build file to parse).
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: carlauncher-release-apk
          path: |
            launcher/app/build/outputs/apk/release/*.apk
            launcher/app/build/outputs/apk/release/output-metadata.json
          if-no-files-found: error

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: carlauncher-debug-apk
          path: launcher/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # v2.9 — a cold-start budget, so a startup regression fails a PR instead of
  # being noticed months later in the car.
  #
  # WHAT THIS NUMBER IS, AND IS NOT. It is measured on an x86_64 emulator on a
  # GitHub runner, not on the QCM6125 head unit, so it is NOT a device figure and
  # must never be quoted as one. It is a tripwire: same image, same APK shape,
  # same procedure every run, so a large jump means we made startup worse.
  # The debug build is what gets installed because release is arm64-only
  # (app/build.gradle.kts) — debug adds x86_64 for exactly this kind of run.
  cold-start:
    runs-on: ubuntu-latest
    # GitHub only: needs /dev/kvm, which the self-hosted runner has no access to.
    if: contains(github.server_url, 'github.com')
    needs: build
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/download-artifact@v4
        with:
          name: carlauncher-debug-apk
          path: apk

      # The emulator needs KVM, which the ubuntu-latest image has but does not
      # expose to the runner user by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator wants a 7.2 GB userdata partition and refuses to boot
      # without room for it — "Not enough space to create userdata partition",
      # before adb ever sees a device. A runner holding the Android SDK, the
      # Gradle caches and the system image does not have that much left.
      # The action's `disk-size` input is not the answer: it writes
      # disk.dataPartition.size into config.ini and this emulator build ignores
      # it, asking for the same 7372.80 MB either way. So make room instead.
      # Nothing removed here is used by an Android build.
      - name: Free disk space for the emulator
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      /opt/hostedtoolcache/CodeQL
          docker image prune -af || true
          df -h /

      # API 33 matches the head unit's Android 13. AOSP ATD image: no Play
      # services, so the measurement is not polluted by GMS starting up.
      #
      # Geometry was `profile: pixel_6` — a 1080x2400 @420dpi PORTRAIT phone,
      # so this job had never once measured startup at the shape the launcher
      # ships on. It now boots 1920x720 @240dpi landscape via config.ini (no
      # SDK device profile is that shape) and asserts it before measuring.
      # That is a different, larger surface to lay out and draw, so the
      # numbers from this job are not comparable to runs before this change.
      - name: Measure cold start
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: aosp_atd
          arch: x86_64
          avd-name: ${{ env.AVD_NAME }}
          force-avd-creation: true
          # Same as the action's defaults; spelled out because overriding this
          # input replaces them wholesale rather than adding to them.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          pre-emulator-launch-script: .github/scripts/headunit-avd.sh
          script: |
            .github/scripts/assert-geometry.sh
            .github/scripts/cold-start.sh apk

  # v3.1 — Compose UI tests that pin the four status indicators (Wi-Fi,
  # Bluetooth, volume, brightness). ROADMAP holds the strip as a stability
  # invariant to v4.0: a redesign may restyle a chip, but must not silently
  # drop one. The tests assert semantics (test tags), never pixels, so a
  # theme change cannot turn them red — only a missing indicator can.
  #
  # They also pin the other half of the rule: a chip with no backing source
  # must vanish rather than invent a value. A runner has no vendor
  # EventService and no car, so the volume chip is legitimately absent here
  # and the suite asserts that absence instead of demanding a lie.
  instrumentation:
    runs-on: ubuntu-latest
    # GitHub only: needs /dev/kvm, which the self-hosted runner has no access to.
    if: contains(github.server_url, 'github.com')
    needs: build
    timeout-minutes: 45
    steps:
      # Full history for the same reason as the build job: this job runs Gradle
      # (connectedDebugAndroidTest), which derives the version from git.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Pinned to the commit v4 points at, NOT the tag. `v4` on gradle/actions is an
      # ANNOTATED tag, and act_runner cannot dereference one: it clones the repo and
      # dies with "Unable to resolve v4: unsupported object type", killing the job
      # before any Gradle task. (`git ls-remote` shows it: gradle/actions returns two
      # lines for v4, a lightweight tag like actions/checkout returns one. v5 is
      # annotated too, so bumping does not help.)
      #
      # A step-level `if:` does NOT avoid this -- actions are resolved before step
      # conditions are evaluated, so the clone happens even when the step is skipped.
      # Pinning is what actually fixes it, and it keeps build caching on both hosts.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # Same KVM enablement as the cold-start job: the image has KVM but does
      # not expose it to the runner user by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator wants a 7.2 GB userdata partition and refuses to boot
      # without room for it — "Not enough space to create userdata partition",
      # before adb ever sees a device. A runner holding the Android SDK, the
      # Gradle caches and the system image does not have that much left.
      # The action's `disk-size` input is not the answer: it writes
      # disk.dataPartition.size into config.ini and this emulator build ignores
      # it, asking for the same 7372.80 MB either way. So make room instead.
      # Nothing removed here is used by an Android build.
      - name: Free disk space for the emulator
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc \
                      /usr/local/share/boost /usr/local/lib/node_modules \
                      /opt/hostedtoolcache/CodeQL
          docker image prune -af || true
          df -h /

      # The debug variant is what installs: release is arm64-only
      # (app/build.gradle.kts), debug adds x86_64 for exactly this.
      - name: Run Compose UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: aosp_atd
          arch: x86_64
          avd-name: ${{ env.AVD_NAME }}
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          pre-emulator-launch-script: .github/scripts/headunit-avd.sh
          # Geometry is asserted before a single test runs: at a phone's width
          # the status bar's icon row does not fit, so an indicator could be
          # laid out off-screen and fail for a reason that is not a regression.
          script: |
            .github/scripts/assert-geometry.sh
            cd launcher && ./gradlew --no-daemon connectedDebugAndroidTest

      # Always upload: a red emulator run is exactly when the HTML report matters.
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carlauncher-androidtest-reports
          path: launcher/app/build/reports/androidTests/
          if-no-files-found: ignore

  # Release traceability. A green build of main gets an annotated tag naming the
  # exact version it was built from, and the release APK from *that same run* is
  # published against the tag with its SHA-256. That is what turns "which APK is
  # in the car" into a question with a checkable answer.
  #
  # Needs both build jobs, so a red run is never tagged and never publishes.
  release:
    runs-on: ubuntu-latest
    needs: [build, cold-start, instrumentation]
    # GitHub only: tags and releases stay on the authoritative remote, or
    # "which APK is in the car" gets two different answers.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.server_url, 'github.com')
    timeout-minutes: 10
    permissions:
      # Job-scoped on purpose: only this job may write refs and releases, every
      # other job in the workflow keeps the default read-only token.
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The artifact from the `build` job above — the APK compiled from this exact
      # commit. Nothing is rebuilt here; a rebuild would not be the artifact the
      # tag is meant to identify.
      - name: Fetch the release APK from this run
        uses: actions/download-artifact@v4
        with:
          name: carlauncher-release-apk
          path: artifact

      # The version comes from output-metadata.json, AGP's record of what is
      # actually baked into the APK sitting next to it — so the tag can never
      # disagree with the artifact it names. The build file carries no version
      # line to parse any more: both fields are derived from git at build time
      # (see app/build.gradle.kts).
      - name: Read version from the built APK metadata
        id: version
        run: |
          set -euo pipefail
          meta="artifact/output-metadata.json"
          if [ ! -f "${meta}" ]; then
            echo "::error::${meta} missing from the carlauncher-release-apk artifact"
            exit 1
          fi

          name="$(jq -r '.elements[0].versionName' "${meta}")"
          code="$(jq -r '.elements[0].versionCode' "${meta}")"

          # Shape check, so a metadata format change fails here rather than
          # after a meaningless tag has already been pushed.
          if ! printf '%s' "$name" | grep -qE '^[0-9]+(\.[0-9]+){1,3}$'; then
            echo "::error::versionName '${name}' is not a dotted numeric version"
            exit 1
          fi
          if ! printf '%s' "$code" | grep -qE '^[0-9]+$'; then
            echo "::error::versionCode '${code}' is not an integer"
            exit 1
          fi

          # Tag identity. versionCode is the commit count now, so it is unique
          # per merge to main — but the short SHA stays in the tag: it is what
          # keeps a tag unique by construction, independent of how the version
          # happens to be derived.
          short="$(git rev-parse --short=7 HEAD)"
          {
            echo "name=${name}"
            echo "code=${code}"
            echo "tag=v${name}+${code}.g${short}"
          } >> "$GITHUB_OUTPUT"
          echo "versionName ${name}, versionCode ${code} -> tag v${name}+${code}.g${short}"

      - name: Create annotated tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail

          # Idempotent: a re-run of this job finds its own tag already on the remote
          # and stops cleanly. The push below is never forced, so even a lost race
          # can only fail — it can never move a tag that points at another build.
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on origin — skipping, nothing to move."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "carlauncher ${VERSION_NAME} (versionCode ${VERSION_CODE})"
          git push origin "refs/tags/${TAG}"
          echo "Tagged ${GITHUB_SHA} as ${TAG}."

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail

          mapfile -t apks < <(find artifact -type f -name '*.apk')
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "::error::expected exactly one release APK in the artifact, found ${#apks[@]}"
            exit 1
          fi

          # Name the asset for the tag, so a downloaded APK still identifies itself
          # once it is sitting on a USB stick with no surrounding context.
          asset="carlauncher-${TAG}.apk"
          cp "${apks[0]}" "${asset}"
          sha="$(sha256sum "${asset}" | cut -d' ' -f1)"

          # Idempotent independently of the tag step, so a re-run after a publish
          # that half-finished still completes the release for an existing tag.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — leaving it untouched."
            exit 0
          fi

          cat > notes.md <<EOF
          Built by CI from commit \`${GITHUB_SHA}\`.

          | | |
          |---|---|
          | versionName | \`${VERSION_NAME}\` |
          | versionCode | \`${VERSION_CODE}\` |
          | APK | \`${asset}\` |
          | SHA-256 | \`${sha}\` |

          This asset is the CI artifact of the tagged main build — the only APK that
          goes on-device. To identify what is already installed, pull the APK off the
          head unit and compare its \`sha256sum\` with the value above.

          Unless the RELEASE_* repository secrets are configured (see
          \`launcher/SIGNING.md\`), this is signed with a **debug** key
          (\`launcher/app/build.gradle.kts\`), so the signature is not stable across
          runners and an update can be refused with a signature mismatch.
          EOF

          gh release create "${TAG}" "${asset}" \
            --verify-tag \
            --title "${TAG}" \
            --notes-file notes.md
