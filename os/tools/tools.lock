# The debug toolbelt Riposte OS carries for work on the unit itself: what a Kali box has in
# reach when the target is an Android head unit. Static aarch64 builds, pinned by sha256.
# fetch.sh downloads this into a cache; build.sh --tools CACHE copies it into the image.
#
#   name          kind   sha256                                                            url[!zip member]
#
#   kind  bin   one static binary  -> /system/riposte/bin/<name>, symlinked from /system/bin
#         tar   a tarball          -> /system/riposte/<name>/ (nmap: nmap ncat nping + data/)
#         apk   an app             -> product/app/<name> (Termux, the terminal on the panel)
#         data  too big for /system (200 MB left under the 6 GiB super): install-data.sh pushes
#               it to /data/local/riposte/bin over adb instead
#
# busybox is the static arm64 one Magisk ships inside its APK (bionic, built for Android);
# busybox.net only publishes 32-bit ARM. Regenerate busybox.applets when its sha changes.
